        "statement": "在持久化 Candidate 物化前，冻结真实 Student Prefix 上的 matched no-op 与不可部署 soft intervention 证据能够预测 downstream Candidate effect，并在预算匹配下提高 useful Candidate yield、减少无效完整评估。"
      },
      {
        "id": "CLAIM-H2A",
        "statement": "对 Student-owned recognition、decision、adherence、fallback 与 parse responsibility 的独立 probe 能够预测未参与 probe 的真实 Prefix 上的 shadow/in-loop realizability。"
      },
      {
        "id": "CLAIM-H2B",
        "statement": "基于逐职责 realizability 证据在 reject、simplify、deterministic lowering 与 ownership reassignment 之间进行 adaptive routing，相对固定 ownership 策略能够提高可实现且有用的 Candidate 产出并减少浪费。"
      },
      {
        "id": "CLAIM-H3",
        "statement": "将已结算轨迹中的 typed verification verdict 与终态转为有 provenance、严格 consumer/scope、可失效和可复查的 role-scoped experience，能够减少跨 attempt/generation 的能力越界、同角色错误复发和方向重走，并提高单位总预算的 useful Candidate yield，同时控制 false pruning 与 held-out utility。"
      }
    ],
    "expected_observable_changes": [
      {
        "claim_id": "CLAIM-H1",
        "change": "Gate-supported 与 Gate-rejected mechanisms 的局部证据对 blind-compiled downstream Candidate effect 产生可复查区分；相对 candidate-first/Direct Compile，在相同 all-in 预算下有效 Candidate 产出率提高且完整 Candidate Evaluation 数下降。"
      },
      {
        "claim_id": "CLAIM-H2A",
        "change": "职责级 probe prediction 与独立 Prefix 上的真实 recognition、decision、adherence、fallback、parse outcome 呈稳定正向判别关系。"
      },
      {
        "claim_id": "CLAIM-H2B",
        "change": "Adaptive routing 相对 strongest fixed routing control 提高 useful/realizable Candidate yield per all-in cost，并减少因 Student 能力不匹配造成的编译和完整评估浪费。"
      },
      {
        "claim_id": "CLAIM-H3",
        "change": "完整经验系统相对 strongest memory control 降低 capability-violating proposal、duplicate direction 与 same-role obligation recurrence，并提高 useful Candidate yield per all-in cost；旁路复查显示被压制方向的净损失受控。"
      }
    ],
