  "working_scope": "固定 Student Model、任务 Evaluator 与基础 Agent Loop，只研究 Prompt、Tool、Parser、Lifecycle Hook 等模型外 Harness 机制的证据驱动进化。",
  "working_problem": "现有 Harness 自进化较早把改进方向实例化为持久化 Candidate，使机制有效性、目标模型可执行性、实现保真度和全局效用在同一次昂贵评估中耦合，导致成本高且失败归因困难。",
  "working_idea": "由外部 Teacher 驱动固定小模型 Student 的双时间尺度 Harness Evolution：单个研究 episode 内先以冻结 Prefix 上的不可部署局部干预验证假设，再验证 Student 逐职责 realizability 后才编译 Candidate；已结算 episode 之间将 typed verification verdict 与终态转为只投影给指定 Researcher/Teacher role 的有作用域研究经验，以指导后续 attempt/generation 搜索。",
  "objectives": [
    "验证 Candidate 编译前的局部干预证据门是否提高有效 Candidate 产出率并减少无效完整评估。",
    "验证 implementation-independent Mechanism 表示能否分离研究有效性、Student 可实现性、实现保真度和最终 Candidate Utility。",
    "验证 Hook Feasibility Gate 是否能在编译前识别固定小模型无法稳定承担的语义职责。",
    "验证 role-scoped、verification-grounded experience 是否减少跨 attempt/generation 的能力越界、角色重复错误和方向重走，同时控制 false pruning。",
    "建立可追溯、可恢复且能够按失败层定向回流的 Harness Evolution 控制流程。"
  ],
  "success_criteria": [
    "相对 Direct Compile 基线，报告 Candidate Yield、Full-Eval Avoidance、每个有效 Candidate 成本和最终任务性能，并使用同口径预算与评测协议。",
    "通过分层消融分别评估 Prefix Intervention、Evidence Gate、Mechanism Distillation、Hook Feasibility 与 Conformance 的增量作用。",
    "在冻结 H1/H2 pipeline 上比较 no-memory、shared、generic role-local、DREvo-like、Auto-Robotist-like 与完整 H3，并报告总成本、误剪和 held-out non-inferiority。",
    "Hook Feasibility 在多种机制复杂度或 Student 能力设置下表现出可复查的部署可实现性预测价值。",
    "所有论文级 Claim 均能追溯到冻结 Run、结构化统计或已核验文献，且负面结果能够定位到对应失败层。"
  ],
  "out_of_scope": [
    "训练、微调或更新 Student Model 参数。",
    "为获得更高分而修改冻结任务 Evaluator、数据标签或基础 Agent Loop。",
    "把 Teacher Role 名称、角色数量、Prefix-Fork primitive 或事件持久化本身作为核心新颖性。",
    "在缺少文献核验和对照实验时声称已经证明成本、Candidate Yield 或最终性能收益。",
