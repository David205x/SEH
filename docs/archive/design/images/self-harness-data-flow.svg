<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1120" height="690" rx="8" fill="#fafbfc"/>
  <rect x="0" y="0" width="1120" height="48" rx="8" fill="url(#header)"/>
  <rect x="0" y="40" width="1120" height="8" fill="url(#header)"/>
  <text x="560" y="31" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Self-Harness — Artifact 数据流与角色可见性</text>

  <!-- Column guides -->
  <text x="105" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Benchmark / Harness</text>
  <text x="330" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Evaluation</text>
  <text x="555" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Diagnosis / Proposal</text>
  <text x="780" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Candidate Validation</text>
  <text x="1010" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Workflow State</text>
  <line x1="217" y1="62" x2="217" y2="622" stroke="#e2e8f0"/>
  <line x1="442" y1="62" x2="442" y2="622" stroke="#e2e8f0"/>
  <line x1="667" y1="62" x2="667" y2="622" stroke="#e2e8f0"/>
  <line x1="895" y1="62" x2="895" y2="622" stroke="#e2e8f0"/>

  <!-- Data flows -->
  <line x1="170" y1="126" x2="270" y2="126" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <line x1="170" y1="228" x2="270" y2="228" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="159" x2="330" y2="194" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <line x1="390" y1="228" x2="495" y2="228" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <path d="M 390 330 L 420 330 L 420 500 L 920 500 L 920 448 L 950 448" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <line x1="555" y1="262" x2="555" y2="304" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <line x1="615" y1="338" x2="720" y2="338" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <line x1="780" y1="372" x2="780" y2="414" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <line x1="840" y1="448" x2="950" y2="448" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <path d="M 1010 482 L 1010 526 L 840 526" fill="none" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <path d="M 720 560 L 650 560 L 650 602 L 105 602 L 105 262" fill="none" stroke="#16a34a" stroke-width="1.7" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <path d="M 950 448 L 915 448 L 915 560 L 840 560" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <path d="M 105 159 L 105 330 L 270 330" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Source nodes -->
  <rect x="40" y="92" width="130" height="67" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="114" text-anchor="middle" fill="#1e3a5f" font-size="10.5" font-weight="700">Fixed Task Split</text>
  <text x="105" y="131" text-anchor="middle" fill="#64748b" font-size="8.5">train / held-in</text>
  <text x="105" y="145" text-anchor="middle" fill="#64748b" font-size="8.5">heldout / private</text>

  <rect x="40" y="194" width="130" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="216" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Active Harness</text>
  <text x="105" y="233" text-anchor="middle" fill="#64748b" font-size="8.5">repo_baseline.py</text>
  <text x="105" y="247" text-anchor="middle" fill="#64748b" font-size="8.5">editable surfaces</text>

  <rect x="40" y="406" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="428" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="700">Fixed Protocol</text>
  <text x="105" y="445" text-anchor="middle" fill="#64748b" font-size="8.5">model · evaluator</text>
  <text x="105" y="459" text-anchor="middle" fill="#64748b" font-size="8.5">budget · tools · env</text>

  <!-- Evaluation nodes -->
  <rect x="270" y="92" width="120" height="67" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="114" text-anchor="middle" fill="#1e3a5f" font-size="10.5" font-weight="700">Harbor Eval</text>
  <text x="330" y="131" text-anchor="middle" fill="#64748b" font-size="8.5">concurrent cases</text>
  <text x="330" y="145" text-anchor="middle" fill="#64748b" font-size="8.5">repeated attempts</text>

  <rect x="270" y="194" width="120" height="68" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="216" text-anchor="middle" fill="#1e3a5f" font-size="10.5" font-weight="700">Held-in Records</text>
  <text x="330" y="233" text-anchor="middle" fill="#64748b" font-size="8.5">messages + tools</text>
  <text x="330" y="247" text-anchor="middle" fill="#64748b" font-size="8.5">verifier evidence</text>

  <rect x="270" y="296" width="120" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="318" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="700">Baseline Split Result</text>
  <text x="330" y="335" text-anchor="middle" fill="#64748b" font-size="8.5">split aggregates</text>
  <text x="330" y="349" text-anchor="middle" fill="#64748b" font-size="8.5">gate only · private hidden</text>

  <!-- Diagnosis/proposal nodes -->
  <rect x="495" y="194" width="120" height="68" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="555" y="216" text-anchor="middle" fill="#5b21b6" font-size="10.5" font-weight="700">Diagnosis Brief</text>
  <text x="555" y="233" text-anchor="middle" fill="#64748b" font-size="8.5">causal clusters</text>
  <text x="555" y="247" text-anchor="middle" fill="#64748b" font-size="8.5">passing IDs + evidence</text>

  <rect x="495" y="304" width="120" height="68" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="555" y="326" text-anchor="middle" fill="#0e7490" font-size="10.5" font-weight="700">ProposalBundle</text>
  <text x="555" y="343" text-anchor="middle" fill="#64748b" font-size="8.5">mechanism + hook</text>
  <text x="555" y="357" text-anchor="middle" fill="#64748b" font-size="8.5">candidate_values</text>

  <rect x="495" y="414" width="120" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="555" y="436" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="700">Visibility Boundary</text>
  <text x="555" y="453" text-anchor="middle" fill="#64748b" font-size="8.5">train evidence only</text>
  <text x="555" y="467" text-anchor="middle" fill="#64748b" font-size="8.5">full surface source</text>

  <!-- Candidate nodes -->
  <rect x="720" y="304" width="120" height="68" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="780" y="326" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">Candidate Dir</text>
  <text x="780" y="343" text-anchor="middle" fill="#64748b" font-size="8.5">current/ + manifest</text>
  <text x="780" y="357" text-anchor="middle" fill="#64748b" font-size="8.5">proposal audit</text>

  <rect x="720" y="414" width="120" height="68" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="780" y="436" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">Candidate Result</text>
  <text x="780" y="453" text-anchor="middle" fill="#64748b" font-size="8.5">train + heldout</text>
  <text x="780" y="467" text-anchor="middle" fill="#64748b" font-size="8.5">repeat pass counts</text>

  <rect x="720" y="526" width="120" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="780" y="548" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Merged Variant</text>
  <text x="780" y="565" text-anchor="middle" fill="#64748b" font-size="8.5">compatible functions</text>
  <text x="780" y="579" text-anchor="middle" fill="#64748b" font-size="8.5">must re-evaluate</text>

  <!-- Workflow state nodes -->
  <rect x="950" y="414" width="120" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1010" y="436" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Acceptance JSON</text>
  <text x="1010" y="453" text-anchor="middle" fill="#64748b" font-size="8.5">split deltas</text>
  <text x="1010" y="467" text-anchor="middle" fill="#64748b" font-size="8.5">accepted / rejected</text>

  <rect x="950" y="526" width="120" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1010" y="548" text-anchor="middle" fill="#334155" font-size="10.5" font-weight="700">Persistent Control</text>
  <text x="1010" y="565" text-anchor="middle" fill="#64748b" font-size="8.5">candidate_queue.json</text>
  <text x="1010" y="579" text-anchor="middle" fill="#64748b" font-size="8.5">branch_state.json</text>

  <rect x="45" y="640" width="1030" height="32" rx="6" fill="#f1f5f9"/>
  <text x="560" y="661" text-anchor="middle" fill="#334155" font-size="10">角色通过窄化 artifact 交接；held-out 只进入自动 promotion gate，Proposer 无法读取其任务与轨迹。</text>
</svg>
