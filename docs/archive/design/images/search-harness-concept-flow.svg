  <text x="542" y="566" text-anchor="middle" fill="#64748b" font-size="8">parent lineage</text>

  <rect x="42" y="512" width="160" height="76" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="122" y="534" text-anchor="middle" fill="#0e7490" font-size="11" font-weight="700">Next Iteration</text>
  <text x="122" y="551" text-anchor="middle" fill="#0e7490" font-size="8.5">accepted 使用新版本</text>
  <text x="122" y="566" text-anchor="middle" fill="#64748b" font-size="8">rejected 继续父版本</text>

