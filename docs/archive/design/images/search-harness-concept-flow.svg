  <rect x="42" y="224" width="160" height="76" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.6"/>
  <text x="122" y="246" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Coordinator Result</text>
  <text x="122" y="263" text-anchor="middle" fill="#92400e" font-size="8.5">supported / rejected</text>
  <text x="122" y="278" text-anchor="middle" fill="#64748b" font-size="8">inconclusive + recommendation</text>

