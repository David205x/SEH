  <path d="M 122 373 L 122 330 L 522 330 L 522 300" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <rect x="60" y="614" width="800" height="30" rx="6" fill="#f1f5f9"/>
  <text x="460" y="634" text-anchor="middle" fill="#334155" font-size="10">核心：先用 prefix-fork 低成本验证机制，再由 Compiler 固化；当前中间 verdict 仍可能提前结束整次 run。</text>
