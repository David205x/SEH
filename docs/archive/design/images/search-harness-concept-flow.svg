  <text x="342" y="412" text-anchor="middle" fill="#92400e" font-size="8.5">manifest · fixed · import</text>
  <text x="342" y="427" text-anchor="middle" fill="#64748b" font-size="8">syntax · smoke rollout</text>

  <rect x="482" y="373" width="160" height="76" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="562" y="395" text-anchor="middle" fill="#1e3a5f" font-size="11" font-weight="700">Candidate Evaluation</text>
  <text x="562" y="412" text-anchor="middle" fill="#1e3a5f" font-size="8.5">同一经验集完整 rollout</text>
  <text x="562" y="427" text-anchor="middle" fill="#64748b" font-size="8">paired provenance</text>

  <rect x="702" y="373" width="160" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
