  <text x="637" y="349" text-anchor="middle" fill="#64748b" font-size="8">hook actions · branch trace</text>
  <text x="637" y="363" text-anchor="middle" fill="#64748b" font-size="8">score · summary</text>

  <rect x="578" y="414" width="118" height="56" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="637" y="436" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">CoordinatorResult</text>
