  <text x="273" y="255" text-anchor="middle" fill="#64748b" font-size="8">tools · hooks · usage</text>
  <line x1="273" y1="270" x2="273" y2="298" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-orange)"/>

