  <text x="273" y="351" text-anchor="middle" fill="#64748b" font-size="8">replicate outcomes</text>

  <rect x="214" y="400" width="118" height="56" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="273" y="422" text-anchor="middle" fill="#0e7490" font-size="10.5" font-weight="700">Fork Prefix</text>
  <text x="273" y="439" text-anchor="middle" fill="#64748b" font-size="8">model-visible context only</text>

  <rect x="214" y="496" width="118" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="273" y="518" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Candidate Report</text>
  <text x="273" y="535" text-anchor="middle" fill="#64748b" font-size="8">paired metrics + traces</text>

