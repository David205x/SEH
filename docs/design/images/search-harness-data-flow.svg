  <text x="827" y="349" text-anchor="middle" fill="#64748b" font-size="8">parent files + evidence</text>
  <text x="827" y="363" text-anchor="middle" fill="#64748b" font-size="8">guides + feedback</text>

  <rect x="768" y="422" width="118" height="74" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="827" y="444" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">Candidate Workspace</text>
  <text x="827" y="461" text-anchor="middle" fill="#64748b" font-size="8">file edits · validation</text>
  <text x="827" y="475" text-anchor="middle" fill="#64748b" font-size="8">digest + parent binding</text>

  <rect x="768" y="532" width="118" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="827" y="554" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Version + Journal</text>
  <text x="827" y="571" text-anchor="middle" fill="#64748b" font-size="8">Git checkpoint · events</text>

  <!-- Visibility note -->
  <rect x="48" y="608" width="824" height="27" rx="6" fill="#f1f5f9"/>
  <circle cx="74" cy="621" r="4" fill="#2563eb"/><text x="84" y="625" fill="#475569" font-size="8.5">数据主链</text>
  <line x1="154" y1="621" x2="178" y2="621" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/><text x="186" y="625" fill="#475569" font-size="8.5">分支 / 反馈</text>
  <text x="460" y="625" text-anchor="middle" fill="#334155" font-size="9.5">当前边界风险：Critic 可读取完整案例字段；Coordinator → Compiler 仍以自由文本为主。</text>
</svg>
