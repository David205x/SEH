  <text x="455" y="241" text-anchor="middle" fill="#64748b" font-size="8">summary · cases</text>
  <text x="455" y="255" text-anchor="middle" fill="#64748b" font-size="8">trajectory · harness</text>

  <rect x="396" y="304" width="118" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
