  <text x="96" y="135" text-anchor="middle" fill="#64748b" font-size="8">example_id · question</text>

  <rect x="38" y="208" width="116" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="96" y="230" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="700">Harness Snapshot</text>
