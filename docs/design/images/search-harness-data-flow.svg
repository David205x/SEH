  <text x="273" y="77" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Actor / Eval</text>
  <text x="455" y="77" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Critic</text>
  <text x="637" y="77" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Intervention</text>
  <text x="827" y="77" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">Compiler / Store</text>
  <line x1="180" y1="62" x2="180" y2="584" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="362" y1="62" x2="362" y2="584" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="548" y1="62" x2="548" y2="584" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="730" y1="62" x2="730" y2="584" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Flows first -->
  <line x1="154" y1="124" x2="214" y2="124" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="154" y1="236" x2="214" y2="236" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="273" y1="151" x2="273" y2="202" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
